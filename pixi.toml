[workspace]
name = "polyglot-clean-code"
version = "0.1.0"
description = "Opinionated Clean Code presets for Alint, Vale, ast-grep and Semgrep."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
bun = ">=1.4.2,<1.5"
# Compilers for the Go and Java example corpus that `doit examples` builds.
go = ">=1.23,<2"
openjdk = ">=21,<22"
convco = ">=0.7.2,<0.8"
lefthook = ">=2.2,<3"
vale = ">=3,<4"
ast-grep = ">=0.51,<0.52"
actionlint = ">=1.7,<2"
shellcheck = ">=0.11,<1"
git = ">=2,<3"

[pypi-dependencies]
alint = ">=0.22,<0.23"
semgrep = "==1.150.0"
doit = ">=0.37,<0.38"
# The developer harness lints automation/ with Rude plus the Clean Code plugin.
rude = "==0.1a4"
rude-clean-code = "==0.1.0"

[tasks]
# The single task registry is automation/dodo.py; every other task delegates to it.
do = "doit"
bun-install = "bun install --frozen-lockfile"
backlog = { cmd = "bun x --bun --no-install backlog task list --plain", depends-on = ["bun-install"] }
