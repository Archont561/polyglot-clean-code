name: Bug report
description: Report a false positive, false negative, or broken preset.
body:
  - type: markdown
    attributes:
      value: Include the preset, tool version, and a minimal source excerpt.
  - type: textarea
    id: expected
    attributes:
      label: Expected finding
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual finding
    validations:
      required: true
