# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1
rules:
- id: pcc-r01-pixi-manifest
  kind: file_exists
  paths: pixi.toml
  level: error
  message: '[PCC-R01] Keep pixi.toml and pixi.lock together; the lockfile is the environment of record.'
- id: pcc-r01-pixi-lock
  kind: file_exists
  paths: pixi.lock
  level: error
  message: '[PCC-R01] Keep pixi.toml and pixi.lock together; the lockfile is the environment of record.'
- id: pcc-r02-dodo-file
  kind: file_exists
  paths: automation/dodo.py
  level: warning
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
- id: pcc-r02-doit-config
  kind: file_exists
  paths: doit.cfg
  level: warning
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
- id: pcc-r02-workflow-run-single-line
  kind: yaml_path_matches
  paths:
  - .github/workflows/*.yml
  path: $.jobs.*.steps[*].run
  matches: ^[^\n]+$
  if_present: true
  level: warning
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
- id: pcc-r03-package-manifest
  kind: file_exists
  paths: package.json
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-bun-lock
  kind: file_exists
  paths: bun.lock
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-skills-lock
  kind: file_exists
  paths: skills-lock.json
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-hooks
  kind: file_exists
  paths: lefthook.yml
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-convco
  kind: file_exists
  paths: .versionrc
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-skills-lock-version
  kind: json_path_equals
  paths: skills-lock.json
  path: $.version
  equals: 1
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r03-bun-package-manager
  kind: json_path_matches
  paths: package.json
  path: $.packageManager
  matches: ^bun@1\.4\.\d+$
  level: warning
  message: '[PCC-R03] Pin Bun developer CLIs, agent skills, hooks and Conventional Commit configuration.'
- id: pcc-r04-readme
  kind: file_exists
  paths: README.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
- id: pcc-r04-agents
  kind: file_exists
  paths: AGENTS.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
- id: pcc-r04-contributing
  kind: file_exists
  paths: CONTRIBUTING.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
- id: pcc-r04-docs-index
  kind: file_exists
  paths: docs/README.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
- id: pcc-r04-development-guide
  kind: file_exists
  paths: docs/guides/development-setup.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
- id: pcc-r04-rule-reference
  kind: file_exists
  paths: docs/reference/rules.md
  level: warning
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance and a documentation index.'
